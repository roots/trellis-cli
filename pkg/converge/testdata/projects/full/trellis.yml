version: 1

defaults:
  timezone: America/Toronto
  php:
    version: "8.4"
    ini:
      memory_limit: 256M
      upload_max_filesize: 64M
    fpm:
      pm: dynamic
      max_children: 20
  mail:
    smtp: smtp.postmarkapp.com:587
    user: secret:mail_user
    password: secret:mail_password
    from: admin@example.com
  security:
    ssh:
      allow_from: [any]
    fail2ban:
      wp_login: true
      xmlrpc: true
  packages:
    - php8.4-imagick
    - ghostscript
  commands:
    - run: fc-cache -f
      on: [/usr/local/share/fonts/]
    - name: tailscale-up
      run: tailscale up --auth-key="$TS_AUTHKEY" --ssh=false
      env: { TS_AUTHKEY: secret:tailscale_authkey }

access:
  admins: [github:example-admin, file:keys/alice.pub]
  deploy: [github:example-admin]

sites:
  example.com:
    repo: git@github.com:example/example.com.git
    path: site
    cache: fastcgi
    object_cache: redis
    writable: [web/app/uploads, web/app/cache]
    php:
      ini: { max_execution_time: 120 }
    env:
      WP_FEATURE_X: "true"
      STRIPE_SECRET_KEY: secret:stripe_secret_key

  shop.example.com:
    repo: git@github.com:example/shop.git
    path: site
    multisite: { mode: subdomains }

environments:
  staging:
    host: 198.51.100.7
    sites:
      example.com: { domain: staging.example.com, branch: develop }
      shop.example.com: null

  production:
    host: 203.0.113.10
    php:
      fpm: { max_children: 40 }
    sites:
      example.com: { domain: example.com, redirects: [www.example.com] }
      shop.example.com: { domain: shop.example.com }
