version: 1

sites:
  example.com:
    repo: git@github.com:example/example.com.git
    path: site

access:
  admins: [github:example-admin]

environments:
  production:
    nodes:
      - name: web1
        host: 203.0.113.10
        private_ip: 10.0.0.4
        roles: [web]
      - name: db1
        host: 203.0.113.11
        private_ip: 10.0.0.5
        roles: [db]
        mariadb:
          innodb_buffer_pool_size: 4G
    sites:
      example.com: { domain: example.com }

  staging:
    nodes: [{ host: 198.51.100.7 }]
    database:
      host: staging-db.abc123.us-east-1.rds.amazonaws.com
      tls: required
      admin:
        user: admin
        password: secret:rds_admin_password
    sites:
      example.com: { domain: staging.example.com }
